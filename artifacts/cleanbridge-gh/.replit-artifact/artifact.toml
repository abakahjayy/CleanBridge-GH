kind = "web"
previewPath = "/"
title = "CleanBridge GH"
description = "A Ghana-focused waste collection platform where households book pickups, collectors manage routes, and operations teams coordinate a cleaner city."
version = "1.0.0"
id = "artifacts/cleanbridge-gh"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 21647

[services.development]
run = "pnpm --filter @workspace/cleanbridge-gh run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/cleanbridge-gh", "run", "build" ]
serve = "static"
publicDir = "artifacts/cleanbridge-gh/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "21647"
BASE_PATH = "/"
